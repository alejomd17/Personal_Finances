<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amortización de crédito</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <h1>Tabla de amortización de crédito</h1>
    <!-- Campos para calcular la tabla de amortización -->
    <form id="amortizationForm">
        <label for="desembolsoDate">Fecha del Préstamo:</label>
        <input type="text" id="desembolsoDate" name="desembolsoDate" placeholder="Ingrese fecha del desembolso AAAA-MM">
        <br>

        <label for="loanAmount">Monto del Préstamo:</label>
        <input type="number" id="loanAmount" name="loanAmount" placeholder="Ingrese el monto del préstamo" required>
        <br>

        <label for="InterestRate">Tasa de Interés:</label>
        <input type="text" id="InterestRate" name="InterestRate" placeholder="Ingrese la tasa de interés" required>
        <br>

        <label for="rateType">Tipo de Tasa:</label>
        <select id="rateType" name="rateType" placeholder="Seleccione si es Nominal o Efectiva">
            <option value="Nominal">Nominal</option>
            <option value="Efectiva" selected>Efectiva</option>
        </select>

        <label for="ratePeriod">Período de la tasa:</label>
        <select id="ratePeriod" name="ratePeriod">
            <option value="Anual" selected>Anual</option>
            <option value="Mensual">Mensual</option>
        </select>
        <br>

        <label for="loanTermYears">Plazo (años):</label>
        <input type="number" id="loanTermYears" name="loanTermYears" placeholder="Ingrese el plazo" required>

        <label for="insurance">Valor del seguro:</label>
        <input type="number" id="insurance" name="insurance" placeholder="Ingrese el valor del seguro si lo conoce">
        <br>
        
        <h4>Abonos a capital</h4>
        <div id="abonosCapital">
            <label for="abonosCapitalDate">Anno Mes:</label>
            <input type="text" id="abonosCapitalDate" name="abonosCapitalDate" placeholder="Ej: 202512"> 

            <label for="abonosCapitalValue">Valor:</label>
            <input type="number" id="abonosCapitalValue" name="abonosCapitalValue" placeholder="Ingrese el valor">
        <button type="button" id ="addAbono">Agregar abono</button>
        </div>
        <table id="dictAbonosCapital">
            <thead>
                <tr>
                    <th>Anno_Mes</th>
                    <th>Valor</th>
                </tr>
            </thead>
            <tbody>
                <!-- Aqui se insertarán los registros -->
            </tbody>
        </table>

        <div id="amortizationResult"></div>

        <button type="submit">Calcular</button>

    </form>
    <div id="amortizationResult"></div>
    <script src="/static/abonos_table.js"></script>
    <script src="/static/amortization.js"></script>
</body>
</html>
